name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Release inventory and compatibility regression tests
        working-directory: .
        run: |
          npm run test:release
          npm run release:check
          npm run release:manifest -- --output "$RUNNER_TEMP/release-manifest.json"

      - name: Archive the reviewed release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/release-manifest.json

      - name: API admission and paid-service boundary regression tests
        working-directory: .
        run: npm run test:api:boundaries

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Rules and content audit regression tests
        run: |
          npm run test:rules
          npm run test:infra
          npm run test:audit:content

      # Vite envs are baked in at build time; createClient() throws on empty
      # values, so use placeholders for a build-only check.
      - name: Build
        env:
          VITE_SUPABASE_URL: http://localhost:8000
          VITE_SUPABASE_KEY: ci-placeholder
          VITE_ENV: production
        run: npm run build

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./docs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Mintlify CLI
        run: npm install --no-audit --no-fund

      - name: Check for broken links
        run: npm run broken-links
