name: Historical content safety

on:
  workflow_dispatch:

concurrency:
  group: historical-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  content-native:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned historical content fixture
        run: |
          git fetch --no-tags --depth=1 origin b5dd54c018ecd414be4dc5659a7c28e7ad4633b7
          git fetch --no-tags --depth=1 origin 756a80011e1d0e3ac9db0e14a304d8cf0f1479a5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install content schema test dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Validate native contracts before fixture startup
        run: npm run test:content:contracts

      - name: Pull pinned native fixture images
        run: |
          docker pull supabase/postgres:15.6.1.146
          docker pull supabase/gotrue:v2.158.1

      - name: Isolated content migration safety tests
        run: npm run test:content:native

      - name: Upload content migration safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasure-vault-native-${{ github.sha }}
          path: |
            .agents/legacy/treasure-vault-native-*.json
            .agents/legacy/treasure-vault-native-*.json.log
          include-hidden-files: true
          if-no-files-found: warn
