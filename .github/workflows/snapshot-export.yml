name: Snapshot export safety
on:
  pull_request:
    branches: [main]
    paths:
      [
        "data/**",
        "scripts/snapshot-export-native.test.mjs",
        ".github/workflows/db_dump.yml",
        ".github/workflows/snapshot-export.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "data/**",
        "scripts/snapshot-export-native.test.mjs",
        ".github/workflows/db_dump.yml",
        ".github/workflows/snapshot-export.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      source:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ format('fixture-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: fixture_source
        ports: ["55417:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fixture_source"
          --health-interval 5s --health-timeout 5s --health-retries 10
      scratch:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ format('fixture-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: fixture_scratch
        ports: ["55416:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fixture_scratch"
          --health-interval 5s --health-timeout 5s --health-retries 10
      compatibility:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ format('fixture-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: fixture_compat
        ports: ["55415:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fixture_compat"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install matching PostgreSQL17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Execute export, sanitization, rollback and compatibility tests
        env:
          PGPASSWORD: ${{ format('fixture-{0}-{1}', github.run_id, github.run_attempt) }}
        run: node --test scripts/snapshot-export-native.test.mjs
