name: Refresh sanitized content snapshot

on:
  workflow_dispatch:
  schedule:
    # This reads production. Keep it independent of code pushes and migrations;
    # the sanitized snapshot supports local development, not production backups.
    # Tuesday 09:00 UTC avoids the Americas' evening peak. Measure provider I/O
    # during exports before deciding whether a replica is justified.
    - cron: '0 9 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  LOCAL_DB: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  dump-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - name: Setup postgres
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc &>/dev/null
          sudo apt update
          sudo apt install postgresql-client-16 locate -y
      - name: Dump Database
        working-directory: ./data
        env:
          DB_URI: ${{ secrets.DB_URI }}
          PGOPTIONS: '-c statement_timeout=60000 -c lock_timeout=5000'
        run: ./ci-dump.sh "$DB_URI"
      # Creates a local copy of the data to work on
      - name: Restore local database
        working-directory: ./data
        run: ./create-db.sh ${{ env.LOCAL_DB }}
      - name: Remove user data
        working-directory: ./data
        run: ./clear-user-data.sh ${{ env.LOCAL_DB }}
      - name: Dump clean data
        working-directory: ./data
        run: pg_dump --data-only --table="public.*" ${{ env.LOCAL_DB }} > data.sql
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '[no ci] Update Schema'
